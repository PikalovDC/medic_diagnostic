[project]
name = "medic-diagnostic"
version = "1.0.0"
description = "Медицинский диагностический центр - система управления записями и услугами"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asgiref==3.11.1",
    "crispy-bootstrap5==2026.3",
    "Django==5.1.3",
    "django-crispy-forms==2.6",
    "django-jazzmin==3.0.4",
    "djangorestframework==3.17.1",
    "pillow==12.2.0",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
    "sqlparse==0.5.5",
    "tzdata==2026.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"