{% extends 'base/base.html' %}

{% block title %}Отмена записи{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-x-circle me-2"></i>Отмена записи
                    </h4>
                </div>
                <div class="card-body text-center py-5">
                    <i class="bi bi-tools display-1 text-primary mb-4 d-block"></i>
                    <h5>Функция отмены записи в разработке</h5>
                    <p class="text-muted mb-4">Приносим извинения за временные неудобства. Для отмены записи, пожалуйста, свяжитесь с нами по телефону.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="tel:+74951234567" class="btn btn-primary">
                            <i class="bi bi-telephone me-2"></i>Позвонить
                        </a>
                        <a href="{% url 'appointments:list' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-2"></i>Вернуться к списку
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
