{% extends 'base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-calendar-check me-2"></i>{{ title }}
                    </h4>
                </div>
                <div class="card-body text-center py-5">
                    <i class="bi bi-clock-history display-1 text-primary mb-4 d-block"></i>
                    <h5>Детальная информация о записи будет доступна позже</h5>
                    <p class="text-muted mb-4">Функционал находится в стадии разработки. Вы можете отслеживать статус записи в общем списке.</p>
                    <a href="{% url 'appointments:list' %}" class="btn btn-primary">
                        <i class="bi bi-arrow-left me-2"></i>Вернуться к списку записей
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
