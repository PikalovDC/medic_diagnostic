<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Медицинская Диагностика{% endblock %}</title>

    <!-- Bootstrap 5 через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        /* Простые стили вместо style.css */
        .service-card { transition: transform 0.3s; }
        .service-card:hover { transform: translateY(-5px); }
        footer { margin-top: 50px; }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Простая навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-heart-pulse me-2"></i>МедДиагностика
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/services/">Услуги</a>
                <a class="nav-link" href="/about/">О компании</a>
                <a class="nav-link" href="/contacts/">Контакты</a>
                {% if user.is_authenticated %}
                    <a class="nav-link" href="/accounts/profile/">Профиль</a>
                    <a class="nav-link" href="/accounts/logout/">Выйти</a>
                {% else %}
                    <a class="nav-link" href="/accounts/login/">Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <main class="container py-4">
        {% block content %}
        <!-- Контент страницы -->
        {% endblock %}
    </main>

    <!-- Простой футер -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 Медицинский Диагностический Центр</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
