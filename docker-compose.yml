services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: med_diagnostic_db
    restart: always
    environment:
      POSTGRES_DB: medical_db
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: medical_password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical_user -d medical_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Сервис Django приложения
  web:
    build: .
    container_name: med_diagnostic_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-production-key-change-in-production
      - DATABASE_URL=postgres://medical_user:medical_password123@db:5432/medical_db
      - ALLOWED_HOSTS=localhost,127.0.0.1

  # Опционально: pgAdmin для управления базой данных (удобно для разработки)
  pgadmin:
    image: dpage/pgadmin4
    container_name: med_diagnostic_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@meddiagnostic.ru
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

# Определяем тома для хранения данных
volumes:
  postgres_data:
  static_volume:
  media_volume:
